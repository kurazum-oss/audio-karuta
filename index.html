<!DOCTYPE html>
<html lang="ja">
    <head>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <meta charset="UTF-8">
        <!-- スマホ対応の必須タグ -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>IndexedDB変数修正模写</title>
        <style>
            body{
                background-color: #2c3e50;
                color: white;
                font-family: "Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
                text-align: center;
                margin: 0;
                padding: 20px;
            }

            /* iPhoneを横向きにしたときに、勝手に文字が大きくなるのを防ぐらしい */
            html {
                -webkit-text-size-adjust: 100%;
            }

            /* iPhoneのボタンの変な影を消すらしい */
            button {
                -webkit-appearance: none;
                appearance: none;
            }

            /* ボタン共通スタイル */
            button{
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;

                width: 100%;
                max-width: 500px;
                margin: 15px auto;
                font-size:  1.2rem;
                font-weight: bold;
                padding: 15px;
                /* margin: 10px; */
                border: none;
                border-radius: 12px;
                /* cursor: pointer;
                box-shadow: 0 4px #1a252f; */
                box-sizing: border-box;
            }

            /* アコーディオン用のスタイル */
            .accordion-content{
                display: block;
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
                box-sizing: border-box;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
                background: rgba(255,255,255,0.05);
                border-radius: 10px;
            }

            .accoridon-title{
                background-color:#444;
                color: white;
                cursor: pointer;
                padding: 10px;
                margin: 20px auto;
                border-radius: 10px;
                user-select: none;
                box-sizing: border-box;
            }

            #dbReset{
                background-color: transparent;
                color: #999;
                border: 1px solid #666;
                width: auto;
                margin-top: 50px;
            }


            button:active {
                box-shadow: 0 1px #666;
                transform: translateY(2px);
                /* 押し込んだ時に少し暗くする */
                background-image: linear-gradient(rgba(0,0,0,0.2),rgba(0,0,0,0.2));
            }

            button:disabled {
                background-color: #7f8c8d !important;
                box-shadow: none;
                transform: none;
                opacity: 0.6;
            }

            /* 各ボタンの色分け */
            #recStart {background-color: #e74c3c; color:white;}
            #recStop {background-color: #c0392b; color: white;}
            #playStart {background-color: #27ae60; color:white;}
            #playBefore {background-color: #7f8c8d; color:white;}
            #playNext {background-color: #2980b9; color:white;}
            #playOneMore {background-color: #f39c12; color:white;}
            
            /* 状態表示 */
            #status {
                font-size: 1.5rem;
                color: #f1c40f;
                margin: 20px 0;
                height: 1.5rem;
            }

            /* カードの枚数表示 */
            #numberOfCards {
                background-color: #34495e;
                padding: 10px;
                border-radius: 5px;
                margin-top: 20px;
            }

            /* 録音リスト（スクロールできるように） */
            #list{               
                list-style: none;
                padding: 0;
                margin: 0;
                
                background:  rgba(255,255,255,0.1);
                border-radius: 10px ;
            }

            #list li{
                padding: 15px;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            /* リストの中にあるボタン専用の設定 */
            #list button{
                width: auto;
                margin: 0 5px;
                padding: 8px 15px;
                font-size: 0.9rem;
                box-shadow: 0 4px #63686b;
            }
            
            /* 最後のアイテムの線は消す */
            #list li:last-child{
                border-bottom: none;
            }

            /* 2つ並べるための枠組み */
            .button-row {
                display: flex;          /* 横に並べる */
                justify-content: center; /* 中央寄せ */
                gap: 10px;              /* ボタン同士の隙間 */
                width: 100%;
                max-width: 500px;
                margin: 0 auto;         /* 全体を中央寄せ */
            }

            /* 横並びの時のボタン専用スタイル */
            .button-row button {
                flex: 1;                /* 幅を均等に分ける */
                margin: 10px 0;         /* 縦の余白だけ残す */
                font-size: 1rem;        /* 2つ並ぶので文字を少し小さく */
                padding: 15px 5px;      /* 左右のパディングを削る */
            }

            /* 「次の札」ボタン（単体）は今まで通りのスタイル */
            #playNext {
                margin-top: 10px;
            }


        </style>
    </head>
    <body>

            <button id="dbReset">（開発用）DB初期化</button> <!-- audioDBを削除 -->
            <button id="recStart">
                <span class="material-symbols-outlined">mic</span>録音開始</button>
            <div id="status"></div>
            <button id="recStop">
                <span class="material-symbols-outlined">square</span>録音停止して保存</button>
            
            <button id="playStart" onclick="playStart()">
                <span class="material-symbols-outlined">celebration</span>かるた開始ボタン</button>

            <!-- <button id="playOneMore" onclick="playOneMore()" disabled>
                <span class="material-symbols-outlined">replay</span>もう一度聞く</button>
            <button id="playBefore" onclick="playBefore()" disabled>
                <span class="material-symbols-outlined">skip_previous</span>前の札</button>
            <button id="playNext" onclick="playNext()" disabled>
                <span class="material-symbols-outlined">skip_next</span>次の札</button> -->
            <div class="button-row">
                <button id="playBefore" onclick="playBefore()" disabled>
                    <span class="material-symbols-outlined">skip_previous</span>前の札
                </button>
                <button id="playOneMore" onclick="playOneMore()" disabled>
                    <span class="material-symbols-outlined">replay</span>もう一度
                </button>
            </div>
            <button id="playNext" onclick="playNext()" disabled>
                <span class="material-symbols-outlined">skip_next</span>次の札
            </button>
            <h3 id="numberOfCards"> </h3>
            
            <!-- <h2>保存された音声の一覧</h2>
            <ul id="list"></ul> -->

            <div id="accordion-btn" class="accordion-title" onclick="toggleAccordion()">
                <span id="arrow">▼</span> 保存された音声を確認する
            </div>

            <div id="accordion" class="accordion-content">
                <ul id="list"></ul>
            </div>



        <script>

            let db;//変数データベースを定義
            let mediaRecorder;//メディアレコーダーを定義
            let chunks = [];//録音したやつを入れる配列を定義

            //カウントダウン用
            const MAX_SEC = 15; //録音時間もこれで設定
            const status = document.getElementById("status");
            let remaining = 0;
            let countdownTimer = null;
            let stopTimer = null;


            //DBを開く
            const request = indexedDB.open("audioDB",1);
            request.onupgradeneeded = event =>{
                db = event.target.result;

                if(!db.objectStoreNames.contains("voices")){
                    db.createObjectStore("voices",{keyPath:"id",autoIncrement:true});
                }
            };

            request.onsuccess = event =>{ //リクエストが成功したら{}の中を実行
                db = event.target.result;
                console.log("DB接続完了！リストを表示するばい")

                showList();
            };

        

            //録音開始
            let stream;
            let stopTimerId; 
            document.getElementById("recStart").onclick = async ()=>{

                disableDuringRecording()

                stream = await navigator.mediaDevices.getUserMedia({audio:true});
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];

                mediaRecorder.ondataavailable = event => chunks.push(event.data); //リクエストが成功した=>を実行
                mediaRecorder.start();

                //カウントダウン開始
                remaining = MAX_SEC;
                status.textContent = `録音中 残り${remaining}秒`;

                countdownTimer = setInterval(()=>{
                    remaining--;
                    status.textContent = `録音中 残り${remaining}秒`;

                    if(remaining <= 0){
                        clearInterval(countdownTimer);
                    }
                },1000);

                
                //止め忘れ防止のため、時間がったら録音を止める
                stopTimerId = setTimeout(() =>{
                    recStop();
                },MAX_SEC * 1000);

            };

            

            //停止して保存
            document.getElementById("recStop").onclick = recStop;
            function recStop(){

                enableAfterRecording();

                //タイマー停止
                if(countdownTimer){
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }

                //タイマーがあれば解除
                if(stopTimerId){
                    clearTimeout(stopTimerId);
                    stopTimerId = null;
                }

                status.textContent = "";


                //録音中ではないときに停止ボタンを押したとき
                if(!mediaRecorder || mediaRecorder.state !=="recording"){
                    console.log("録音中ではないため止めません");
                    return;
                }

                mediaRecorder.stop();
                
                mediaRecorder.onstop = () =>{
                    const blob = new Blob(chunks,{type:"audio/mp4"}); //"audio/webm"はiPhoneで使えない

                    const tx = db.transaction("voices","readwrite");
                    const store = tx.objectStore("voices");
                    const req = store.count(); //storeの数を数える。非同期なのでonsuccessが必要

                    req.onsuccess = () =>{
                        store.add({audio:blob}); //idはautoIncrementで自動付与
                                                // ※録音したものを削除してもidは戻らない
                        console.log(`voices は ${req.result} 件あります`);
                    }
                    tx.oncomplete = () => {
                      console.log("count 完了");
                      showList();
                    };
                };
                
                //マイクを完全に止める※しないと電力消費し続ける
                const tracks = stream?.getTracks();
                if(tracks){
                    tracks.forEach((track) => {
                      track.stop();
                      console.log("マイクは完全に停止しました")
                    });
                    stream = null;
                }

            };

            //一覧を表示
            function showList(){
                const ul = document.getElementById("list");
                ul.innerHTML = "";//一度クリア

                const tx = db.transaction("voices", "readonly");
                const store = tx.objectStore("voices");
                const req = store.getAll();

                req.onsuccess = () =>{
                    const results = req.result;

                    results.forEach(element => {
                        const li = document.createElement("li");
                    

                        const playbtn = document.createElement("button");
                        playbtn.textContent = "再生";
                        playbtn.onclick = ()=> playSound(element.id);

                        const delBtn = document.createElement("button");
                        delBtn.textContent = "削除";
                        delBtn.onclick = () =>deleteSound(element.id);

                        li.textContent = `id${element.id}`;

                        li.appendChild(playbtn);
                        li.appendChild(delBtn);

                        ul.appendChild(li);
                        
                    });
                }
            }

            //データベースから音声を再生
            function playSound(id){
                const tx = db.transaction("voices","readonly");
                const store = tx.objectStore("voices");
                const req = store.get(id);

                req.onsuccess = ()=>{
                    const audioURL = URL.createObjectURL(req.result.audio);
                    const audio = new Audio(audioURL);

                    // 再生が終わったらメモリを開放する※これがないとどんどんメモリに溜まるらしい
                    audio.onended = () =>{
                        URL.revokeObjectURL(audioURL);
                        console.log("メモリを解放しました")
                    };

                    audio.play();

                };
            }

            //データベースの読み札を削除
            function deleteSound(id){
                const tx = db.transaction("voices", "readwrite");
                const store = tx.objectStore("voices");

                store.delete(id);

                tx.oncomplete = () => {
                    showList();
                };
            }

            //データベースからidだけを読みだして配列にする？
            function loadIds(){
                return new Promise(resolve =>{
                    const tx = db.transaction("voices","readonly");
                    const store = tx.objectStore("voices");
        
                    const ids = [];
        
                    store.openCursor().onsuccess = e =>{
                        const cursor = e.target.result;
                        if(cursor){
                            ids.push(cursor.key); //←id
                            cursor.continue();
                        }
                    };

                    tx.oncomplete = ()=> resolve(ids);
                });
            }

            //idをシャッフル
            function shuffle(array){
                for(let i = array.length-1;i>0;i--){
                    const j = Math.floor(Math.random()*(i+1));
                    [array[i],array[j]] = [array[j],array[i]];
                }
            }
            
            //開発用DB削除
            document.getElementById("dbReset").onclick = () =>{
                indexedDB.deleteDatabase("audioDB");
                alert("DBを削除しました。リロードしてください。");
            }


            //シャッフルして再生
            let shuffledIds = [];
            let currentIndex = 0
            let numberOfCards;

            async function prepare() {
                shuffledIds = await loadIds();
                shuffle(shuffledIds);
                currentIndex = 0;                
            }

            async function playStart(){ //prepare()が終わる前に「次の札」ボタンを押せるのを
                                        // 防ぐためにasyncとawaitを入れる…らしい
                const result = confirm("かるたをはじめますか？")
                if(!result) return;
                showList();
                disableDuringPlay();
                await prepare();
                alert("準備完了！※読み札が再生されます");
                //何枚目かの表示を作る
                if(!numberOfCards){
                    numberOfCards = document.getElementById("numberOfCards");
                    numberOfCards.textContent = `${shuffledIds.length}枚目中、${1}枚目`;
                    
                }else{
                    numberOfCards.textContent = `${shuffledIds.length}枚目中、${1}枚目`;
                }
                playNext();
            }

            let playId;
            function playNext(){
                if(currentIndex >= shuffledIds.length){
                    alert("全部再生しました");
                    enableAfterPlay();
                    return;
                }
                playId = shuffledIds[currentIndex];
                currentIndex++;

                playSound(playId);
                numberOfCards.textContent = `${shuffledIds.length}枚目中、${currentIndex}枚目`;
            }

            function playBefore(){
                if(currentIndex >= 2){
                    currentIndex -= 2;
                    playNext();
                }
            }

            function playOneMore(){
                playSound(playId);
            }


            function disableDuringRecording(){
                document.getElementById("recStart").disabled = true;
                document.getElementById("playBefore").disabled = true;
                document.getElementById("playStart").disabled = true;
                document.getElementById("playNext").disabled = true;
                document.getElementById("playOneMore").disabled = true;
                console.log("ボタン使用不可！")
            }

            function enableAfterRecording(){
                document.getElementById("recStart").disabled = false;
                document.getElementById("playStart").disabled = false;
                //document.getElementById("playBefore").disabled = false;
                //document.getElementById("playNext").disabled = false;
                //document.getElementById("playOneMore").disabled = false;
                console.log("ボタン使用可能！")
            }

            function disableDuringPlay(){
                document.getElementById("recStart").disabled = true;
                document.getElementById("recStop").disabled = true;
                //document.getElementById("play").disabled = true;
                document.getElementById("playStart").disabled = true;
                document.getElementById("playBefore").disabled = false;
                document.getElementById("playNext").disabled = false;
                document.getElementById("playOneMore").disabled = false;
                console.log("プレイ開始。ボタン使用不可！")
            }

            function enableAfterPlay(){
                document.getElementById("recStart").disabled = false;
                document.getElementById("recStop").disabled = false;
                //document.getElementById("play").disabled = false;
                //document.getElementById("shufflePlay").disabled = false;
                document.getElementById("playStart").disabled = false;
                document.getElementById("playBefore").disabled = true;
                document.getElementById("playNext").disabled = true;
                document.getElementById("playOneMore").disabled = true;
                numberOfCards.textContent = "";
                console.log("プレイ終了。ボタン使用可能！")
            }
            
            function toggleAccordion(){
                const content = document.getElementById("accordion");
                if (content.style.maxHeight) {
                    content.style.maxHeight = null;
                    arrow.textContent = "▼";
                } else {
                    // 中身の高さに合わせて開く
                    content.style.maxHeight = content.scrollHeight + "px";
                    arrow.textContent = "▲";
                }
            }
            
            
            </script>
    </body>

</html>
